plugins {
    id 'com.android.library'
    id 'org.lsposed.lsparanoid'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.elite"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion "29.0.14206865"

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    defaultConfig {
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'proguard.txt'

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Build native from source (prebuilt AAR .so had buggy SystemProperties hook → SIGABRT on DF launch).
    // Use junction path E:\changelib if workspace path has spaces.
    /*externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }*/

    sourceSets {
        main {
            // Prefer freshly built .so; keep empty/backup jniLibs out of packaging collision.
            jniLibs.srcDirs = ['src/main/jniLibsBuilt']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        aidl true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        def aidlDir = file("${buildDir}/generated/aidl_source_output_dir")
        if (aidlDir.exists()) {
            fileTree(aidlDir).matching { include '**/*.java' }.each { File javaFile ->
                def lines = javaFile.readLines()
                def fixed = lines.findAll { !it.startsWith(' * Using:') }
                if (fixed.size() != lines.size()) {
                    javaFile.text = fixed.join(System.lineSeparator()) + System.lineSeparator()
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.2'

    compileOnly "com.google.auto.service:auto-service:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"
    implementation "com.squareup:javapoet:1.13.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
}
